version: '3.8'

# ==============================================================================
# NebulaGuard SOC - Déploiement Stack Portainer (Repository / GitOps)
# ==============================================================================
# Construit directement depuis le dépôt Git sans nécessiter d'authentification
# ni d'accès à un registre externe privé (évite l'erreur "denied denied").
# Application accessible après déploiement sur : http://<IP_SERVEUR>:3333
# ==============================================================================

services:
  nebulaguard-soc:
    container_name: nebulaguard-zyxel-soc
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped

    ports:
      # Port hôte 3333 vers le port 3000 interne du conteneur
      - "${HOST_PORT:-3333}:3000"
      # Configuration réseau et ports dans Portainer (Réseau entrant Syslog) :
      # • Host (Serveur Ubuntu) : 514
      # • Container (Votre IA) : 514
      # • Protocol : UDP (Syslog Zyxel utilise UDP, pas TCP)
      - "${SYSLOG_UDP_PORT:-514}:514/udp"
      - "5140:5140/udp"

    environment:
      - NODE_ENV=production
      - PORT=3000
      - SYSLOG_UDP_PORT=${SYSLOG_UDP_PORT:-514}
      - TZ=${TZ:-Europe/Paris}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - APP_URL=${APP_URL:-http://localhost:3333}
      # 1. Variables de configuration Nebula injectées dans le conteneur Docker (Portainer: Advanced settings > Env)
      - NEBULA_API_KEY=${NEBULA_API_KEY:-${ZYXEL_NEBULA_API_KEY:-}}
      - NEBULA_ORG_ID=${NEBULA_ORG_ID:-${ZYXEL_NEBULA_ORG_ID:-ORG-ZYXEL-FR-88412}}
      - NEBULA_SITE_ID=${NEBULA_SITE_ID:-${ZYXEL_NEBULA_SITE_ID:-site-paris-hq}}
      - NEBULA_API_URL=${NEBULA_API_URL:-${ZYXEL_NEBULA_API_URL:-https://zyxel.com}}
      # Rétrocompatibilité alias ZYXEL_NEBULA_*
      - ZYXEL_NEBULA_ORG_ID=${NEBULA_ORG_ID:-${ZYXEL_NEBULA_ORG_ID:-ORG-ZYXEL-FR-88412}}
      - ZYXEL_NEBULA_SITE_ID=${NEBULA_SITE_ID:-${ZYXEL_NEBULA_SITE_ID:-site-paris-hq}}
      - ZYXEL_NEBULA_API_URL=${NEBULA_API_URL:-${ZYXEL_NEBULA_API_URL:-https://zyxel.com}}
      - ZYXEL_NEBULA_API_KEY=${NEBULA_API_KEY:-${ZYXEL_NEBULA_API_KEY:-}}

    # Test de santé interne sur loopback du conteneur
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - nebula-soc-net

networks:
  nebula-soc-net:
    driver: bridge
